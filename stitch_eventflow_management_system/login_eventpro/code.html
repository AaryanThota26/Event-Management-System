<body class="min-h-screen flex flex-col justify-center items-center p-md glass-background">

<main class="w-full max-w-[480px] z-10">

<!-- Social Login Options -->
<div class="flex flex-col sm:flex-row gap-md mb-xl">

<div class="w-full border-t border-outline-variant"></div>

<!-- Login Form -->
<form class="space-y-lg" onsubmit="return false;">
<div class="space-y-xs">

<span>Sign in to Dashboard</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">

<div class="fixed bottom-0 right-0 w-1/3 h-1/3 -z-10 opacity-20 pointer-events-none">
<div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary rounded-full blur-[120px]"></div>
</div>
<script>
        // Simple Micro-interaction for form focus
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
            });
        });

        // Submit animation simulation
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', (e) => {
            if(document.querySelector('form').checkValidity()) {
                const originalContent = loginBtn.innerHTML;
                loginBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span><span>Authenticating...</span>`;
                loginBtn.disabled = true;
                loginBtn.classList.add('opacity-80');
                
                setTimeout(() => {
                    loginBtn.innerHTML = `<span class="material-symbols-outlined">check_circle</span><span>Success</span>`;
                    loginBtn.classList.replace('bg-primary', 'bg-green-600');
                    setTimeout(() => {
                        // Normally would redirect
                        loginBtn.innerHTML = originalContent;
                        loginBtn.classList.replace('bg-green-600', 'bg-primary');
                        loginBtn.disabled = false;
                        loginBtn.classList.remove('opacity-80');
                    }, 1000);
                }, 1500);
            }
        });
    </script>
